data:
  root: /content/preprocessed
  train_csv: train.csv
  val_csv: val.csv
  num_workers: 4
  infer_width: 1024
  infer_height: 512

model:
  encoder: efficientnet-b4
  encoder_weights: imagenet
  num_classes: 8

training:
  epochs: 50
  batch_size: 4
  lr: 3.0e-4
  weight_decay: 1.0e-4
  grad_clip: 1.0
  warmup_epochs: 5
  mixed_precision: true
  ignore_index: 255
  ce_weight: 0.5
  dice_weight: 0.5
  class_weights: [0.0, 1.0, 1.0, 3.0, 1.0, 1.0, 3.0, 1.0]

augmentation:
  hflip_p: 0.5
  color_jitter: {brightness: 0.2, contrast: 0.2, saturation: 0.2, hue: 0.1}

checkpointing:
  dir: /content/drive/MyDrive/road_seg_checkpoints
